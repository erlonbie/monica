services:
  laravel.test: &app
    build:
      context: .
      dockerfile: ./docker/8.4/Dockerfile
      args:
        WWWGROUP: '${WWWGROUP}'
    image: sail-8.4/app
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '${APP_PORT:-80}:80'
      - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
    environment:
      WWWUSER: '${WWWUSER:-1000}'
      WWWGROUP: '${WWWGROUP:-1000}'
      LARAVEL_SAIL: 1
      XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
      XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
      IGNITION_LOCAL_SITES_PATH: '${PWD}'
      INITIAL_USER_EMAIL: '${INITIAL_USER_EMAIL}'
      INITIAL_USER_PASSWORD: '${INITIAL_USER_PASSWORD}'
    volumes:
      - './.env:/var/www/html/.env'
    entrypoint: >
      /bin/sh -c "
      if [ ! -z \"$WWWUSER\" ]; then usermod -u \"$WWWUSER\" sail; fi &&
      mkdir -p /var/www/html/storage/framework/sessions /var/www/html/storage/framework/views /var/www/html/storage/framework/cache /var/www/html/storage/logs &&
      chown -R sail:sail /var/www/html/storage /var/www/html/bootstrap/cache /var/www/html/public &&
      chmod -R 775 /var/www/html/storage /var/www/html/bootstrap/cache &&
      gosu sail php artisan config:clear &&
      gosu sail php artisan waitfordb &&
      gosu sail php artisan migrate --force &&
      gosu sail php artisan db:seed --force &&
      gosu sail php artisan storage:link --force &&
      /usr/local/bin/start-container
      "
    networks:
      - sail
    depends_on:
      - mariadb
      - redis
      - memcached
      - meilisearch
      - mailpit
  laravel.queue:
    build:
      context: .
      dockerfile: ./docker/8.4/Dockerfile
      args:
        WWWGROUP: '${WWWGROUP}'
    image: sail-8.4/app
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    environment:
      WWWUSER: '${WWWUSER:-1000}'
      WWWGROUP: '${WWWGROUP:-1000}'
      LARAVEL_SAIL: 1
      XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
      XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
      IGNITION_LOCAL_SITES_PATH: '${PWD}'
    volumes:
      - './.env:/var/www/html/.env'
    networks:
      - sail
    depends_on:
      - mariadb
      - redis
      - memcached
      - meilisearch
      - mailpit
    restart: on-failure
    entrypoint: >
      /bin/sh -c "
      if [ ! -z \"$WWWUSER\" ]; then usermod -u \"$WWWUSER\" sail; fi &&
      chown -R sail:sail /var/www/html/storage /var/www/html/bootstrap/cache &&
      chmod -R 775 /var/www/html/storage /var/www/html/bootstrap/cache &&
      gosu sail php artisan waitfordb &&
      exec gosu sail php artisan queue:work --sleep=10 --timeout=0 --tries=3 --queue=high,default,low
      "
  laravel.cron:
    build:
      context: .
      dockerfile: ./docker/8.4/Dockerfile
      args:
        WWWGROUP: '${WWWGROUP}'
    image: sail-8.4/app
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    environment:
      WWWUSER: '${WWWUSER:-1000}'
      WWWGROUP: '${WWWGROUP:-1000}'
      LARAVEL_SAIL: 1
      XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
      XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
      IGNITION_LOCAL_SITES_PATH: '${PWD}'
    volumes:
      - './.env:/var/www/html/.env'
    networks:
      - sail
    depends_on:
      - mariadb
      - redis
      - memcached
      - meilisearch
      - mailpit
    restart: on-failure
    entrypoint: >
      /bin/sh -c "
      if [ ! -z \"$WWWUSER\" ]; then usermod -u \"$WWWUSER\" sail; fi &&
      chown -R sail:sail /var/www/html/storage /var/www/html/bootstrap/cache &&
      chmod -R 775 /var/www/html/storage /var/www/html/bootstrap/cache &&
      gosu sail php artisan waitfordb &&
      exec gosu sail php artisan schedule:run
      "
  mariadb:
    image: 'mariadb:10'
    ports:
      - '${FORWARD_DB_PORT:-3306}:3306'
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_ROOT_HOST: '%'
      MYSQL_DATABASE: 'monica'
      MYSQL_USER: 'monica'
      MYSQL_PASSWORD: secret
      MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
    volumes:
      - 'sail-mariadb:/var/lib/mysql'
      - './docker/mysql/create-testing-database.sh:/docker-entrypoint-initdb.d/10-create-testing-database.sh'
    networks:
      - sail
    healthcheck:
      test:
        - CMD
        - mysqladmin
        - ping
        - '-psecret'
      retries: 3
      timeout: 5s
  redis:
    image: 'redis:alpine'
    ports:
      - '${FORWARD_REDIS_PORT:-6379}:6379'
    volumes:
      - 'sail-redis:/data'
    networks:
      - sail
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      retries: 3
      timeout: 5s
  memcached:
    image: 'memcached:alpine'
    ports:
      - '${FORWARD_MEMCACHED_PORT:-11211}:11211'
    networks:
      - sail
  meilisearch:
    image: 'getmeili/meilisearch:latest'
    ports:
      - '${FORWARD_MEILISEARCH_PORT:-7700}:7700'
    environment:
      MEILI_NO_ANALYTICS: '${MEILISEARCH_NO_ANALYTICS:-false}'
    volumes:
      - 'sail-meilisearch:/meili_data'
    networks:
      - sail
    healthcheck:
      test:
        - CMD
        - wget
        - '--no-verbose'
        - '--spider'
        - 'http://localhost:7700/health'
      retries: 3
      timeout: 5s
  mailpit:
    image: 'axllent/mailpit:latest'
    ports:
      - '${FORWARD_MAILPIT_PORT:-1025}:1025'
      - '${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025'
    networks:
      - sail
networks:
  sail:
    driver: bridge
volumes:
  sail-mariadb:
    driver: local
  sail-redis:
    driver: local
  sail-meilisearch:
    driver: local
